name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint and format check
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Type-check Core
        run: python -m mypy

      - name: Validate skill metadata and resources
        run: python tools/validate_skill.py skills/papers-reading-skill

      - name: Validate public schemas
        run: python tools/export_schemas.py --check

      - name: Validate deterministic examples
        run: python tools/generate_examples.py --check

      - name: Compile Python sources
        run: python -m compileall -q src skills tools tests

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
